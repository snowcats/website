<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>snowcats.org</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Snowcats M"', 'sans-serif'],
            body: ['"Snowcats S"', 'sans-serif'],
            accent: ['"Snowcats A"', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    @font-face { font-family: 'Snowcats M'; src: url('assets/m.ttf') format('truetype'); }
    @font-face { font-family: 'Snowcats S'; src: url('assets/s.otf') format('opentype'); }
    @font-face { font-family: 'Snowcats A'; src: url('assets/a.otf') format('opentype'); }
    img:not([src]), img[src=""] { display: none !important; }
    .brand { margin-top: calc((18 - 1) * 3px - 2.5rem); }
    #top-cat { margin-top: calc((21 - 1) * 3px - 2.5rem); }
    .social-links {
      position: fixed; top: calc((4 - 1) * 3px); right: 1.5rem; z-index: 20;
      display: inline-flex; align-items: center; gap: 0.85rem;
    }
    .social-links a {
      display: inline-flex; align-items: center; gap: 0.35rem;
      font-family: 'Snowcats A', sans-serif; color: #000; text-decoration: none; line-height: 1;
    }
    .social-links img { width: 14px; height: 14px; image-rendering: pixelated; display: block; }
    .social-links .icon-dolls { width: 16px; height: 16px; flex-shrink: 0; }
    .social-links .icon-dolls img { width: 100%; height: 100%; object-fit: contain; image-rendering: auto; }
    @media (min-width: 640px) {
      .brand { margin-top: calc((18 - 1) * 3px - 3.5rem); }
      #top-cat { margin-top: calc((21 - 1) * 3px - 3.5rem); }
      .social-links { right: 2.5rem; }
    }
  </style>
</head>

<body class="min-h-screen bg-white text-black font-body antialiased px-6 py-10 sm:px-10 sm:py-14">
    <div class="social-links">
    <a href="https://github.com/snowcats"><img src="assets/github.png" alt="" width="14" height="14">github</a>
    <a href="https://dol.ls/snowcats"><span class="icon-dolls"><img src="assets/dolls.png" alt="" width="18" height="18"></span>dolls</a>
  </div>
  
  <div class="flex flex-col gap-10 md:flex-row md:items-start md:justify-between md:gap-12 mx-auto max-w-5xl">
    
    <div class="brand shrink-0 max-w-sm">
      <header>
        <h1 class="font-accent text-4xl sm:text-5xl tracking-tight leading-none">snowcats.org</h1>
        <p class="mt-3 text-base sm:text-lg text-black/55">
          A private place to play with cats in the snow, and develop free solutions and programs.
        </p>
      </header>
      <button id="cat-btn" type="button" class="mt-6 font-body bg-black text-white px-5 py-2.5 text-sm tracking-wide hover:bg-white hover:text-black border border-black outline-none focus:outline-none transition-colors cursor-pointer">
        give me a cat
      </button>
      <img id="cat" alt="" hidden class="mt-4 block w-full object-cover border-0 outline-none">
    </div>
    <img id="top-cat" alt="" hidden class="block w-full max-w-md aspect-[4/3] object-cover border-0 outline-none md:ml-auto">
  </div>

  <script>
    const cats = Array.from({ length: 13 }, (_, i) => `assets/${i + 1}.jpg`);
    const topCat = document.querySelector('#top-cat');
    const cat = document.querySelector('#cat');
    const catButton = document.querySelector('#cat-btn');
    const randomCat = () => cats[Math.floor(Math.random() * cats.length)];
    topCat.onload = () => { topCat.hidden = false; };
    topCat.onerror = () => { topCat.hidden = true; topCat.removeAttribute('src'); };
    topCat.src = randomCat();
    catButton.addEventListener('click', () => {
      cat.hidden = true;
      cat.removeAttribute('src');
      cat.onload = () => { cat.hidden = false; };
      cat.onerror = () => { cat.hidden = true; cat.removeAttribute('src'); };
      cat.src = `https://cataas.com/cat?${Date.now()}`;
    });
  </script>
</body>
</html>
